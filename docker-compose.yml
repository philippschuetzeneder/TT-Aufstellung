services:
  postgres:
    image: postgres:16-alpine
    container_name: tt-aufstellung-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tt_aufstellung
      POSTGRES_USER: tt
      POSTGRES_PASSWORD: tt_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tt -d tt_aufstellung"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
