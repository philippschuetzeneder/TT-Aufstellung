<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XTTV Auto-Import</title></head><body><h1>XTTV Auto-Import</h1><pre id="log">Starte …</pre><script>(async()=>{const p=new URLSearchParams(location.search),s=Number(p.get("start")),e=Number(p.get("end")),b=Number(p.get("batch")||"200"),log=t=>document.getElementById("log").textContent+=`\n${t}`;if(!Number.isInteger(s)||!Number.isInteger(e)||s>e||!Number.isInteger(b)||b<1||b>1000){log("Ungültige Parameter");return}let n=0,total=0;for(;;){n++;const u=`/api/xttv/scan-import?start=${s}&end=${e}&limit=${b}&cb=${Date.now()}-${n}`;log(`Batch ${n}: ${s}-${e}, limit=${b}`);let r;try{r=await fetch(u,{cache:"no-store"})}catch(x){log(`Netzwerkfehler: ${x}`);return}let d;try{d=await r.json()}catch(x){log(`HTTP ${r.status}: kein JSON`);return}if(!d.ok){log(JSON.stringify(d));return}total+=Number(d.imported||0);log(`checked=${d.checked}, imported=${d.imported}, skipped=${d.skipped_existing}, errors=${d.errors}, stopped=${d.stopped_after_limit}, totalImported=${total}`);if(!d.stopped_after_limit){log(`FERTIG: ${total} neue Spiele importiert.`);return}await new Promise(x=>setTimeout(x,250))}})();</script></body></html>
