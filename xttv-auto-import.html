<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>XTTV Auto-Import</title>
</head>
<body>
  <h1>XTTV Auto-Import</h1>
  <pre id="log">Starte …</pre>
  <script>
    (async()=>{
      const p=new URLSearchParams(location.search),
        s=Number(p.get("start")),
        e=Number(p.get("end")),
        b=Number(p.get("batch")||"200"),
        log=t=>document.getElementById("log").textContent+=`\n${t}`;

      if(!Number.isInteger(s)||!Number.isInteger(e)||s>e||!Number.isInteger(b)||b<1||b>1000){
        log("Ungültige Parameter");
        return;
      }

      const maxRetries=8;
      const retryDelayMs=retry=>Math.min(30000,5000*2**(retry-1));
      let n=0,total=0;

      for(;;){
        n++;
        const u=`/api/xttv/scan-import?start=${s}&end=${e}&limit=${b}&cb=${Date.now()}-${n}`;
        log(`Batch ${n}: ${s}-${e}, limit=${b}`);

        let r;
        let d;
        let succeeded=false;

        for(let retry=0;retry<=maxRetries;retry++){
          try{
            r=await fetch(u,{cache:"no-store"});
          }catch(x){
            if(retry===maxRetries){
              log(`Netzwerkfehler nach ${maxRetries} Wiederholungen: ${x}`);
              return;
            }
            const wait=retryDelayMs(retry+1);
            log(`Netzwerkfehler – Wiederholung ${retry+1}/${maxRetries} in ${Math.ceil(wait/1000)}s …`);
            await new Promise(x=>setTimeout(x,wait));
            continue;
          }

          if(r.ok){
            try{
              d=await r.json();
              succeeded=true;
              break;
            }catch(x){
              if(retry===maxRetries){
                log(`HTTP ${r.status}: kein JSON nach ${maxRetries} Wiederholungen`);
                return;
              }
            }
          }else if(r.status===429||r.status>=500){
            if(retry===maxRetries){
              log(`HTTP ${r.status}: nach ${maxRetries} Wiederholungen abgebrochen`);
              return;
            }
            const wait=retryDelayMs(retry+1);
            log(`HTTP ${r.status} – Wiederholung ${retry+1}/${maxRetries} in ${Math.ceil(wait/1000)}s …`);
            await new Promise(x=>setTimeout(x,wait));
            continue;
          }else{
            try{
              d=await r.json();
            }catch(x){
              log(`HTTP ${r.status}: kein JSON`);
              return;
            }
            succeeded=true;
            break;
          }

          if(!succeeded){
            if(retry===maxRetries){
              log(`HTTP ${r.status}: kein JSON nach ${maxRetries} Wiederholungen`);
              return;
            }
            const wait=retryDelayMs(retry+1);
            log(`HTTP ${r.status}: kein JSON – Wiederholung ${retry+1}/${maxRetries} in ${Math.ceil(wait/1000)}s …`);
            await new Promise(x=>setTimeout(x,wait));
          }
        }

        if(!d){
          log("Keine gültige Antwort erhalten.");
          return;
        }

        if(!d.ok){
          log(JSON.stringify(d));
          return;
        }

        total+=Number(d.imported||0);
        log(`checked=${d.checked}, imported=${d.imported}, skipped=${d.skipped_existing}, errors=${d.errors}, stopped=${d.stopped_after_limit}, totalImported=${total}`);

        if(!d.stopped_after_limit){
          log(`FERTIG: ${total} neue Spiele importiert.`);
          return;
        }

        await new Promise(x=>setTimeout(x,250));
      }
    })();
  </script>
</body>
</html>
